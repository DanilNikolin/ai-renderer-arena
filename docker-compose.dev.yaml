version: "3.9"
services:
  db:
    image: postgres:16
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: pgadmin
    env_file: .env
    ports:
      - "5050:80"        # open http://localhost:5050
    volumes:
      - pgadmin_data:/var/lib/pgadmin        # persist pgAdmin config
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL} 
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    depends_on: 
      db:
        condition: service_healthy
      minio:
        condition: service_started
      minio-setup:
        condition: service_completed_successfully
    working_dir: /app
    command: >
      sh -lc "
      cd /app &&
      echo USING MIGRATE: $(node -p 'require(\"./package.json\").scripts[\"migrate:dev\"]') &&
      npm run migrate:dev &&
      npm run dev
      "
    volumes:
      - .:/app
      - /app/node_modules

  minio:
    image: minio/minio:latest
    command: ["server","/data","--address",":9000","--console-address",":9001"]
    env_file: ./minio.env
    ports:
      - "9002:9000"   # MinIO S3 API → http://localhost:9002
      - "9001:9001"   # MinIO console
    volumes: [ "minio_data:/data" ]

  minio-setup:
    image: minio/mc:latest
    env_file: ./minio.env
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb -p local/prompt-images || true &&
      mc anonymous set download local/prompt-images || true
      "

volumes:
  pgdata: {}
  minio_data: {} 
  pgadmin_data: {}
